aid: terminal-shop
name: Terminal
review:
  question: Does Terminal expose a documented public WebSocket or streaming API?
  answer: false
  date: '2026-06-20'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. Terminal's public API is a plain
    request/response REST API. There is no documented WebSocket, Server-Sent
    Events, or other streaming transport. The `ssh terminal.shop` storefront
    is an interactive SSH TUI, not a documented public streaming API surface,
    and it is backed by the same REST endpoints modeled in
    openapi/terminal-shop-openapi.yml.
findings:
  summary: |
    Terminal publishes a public REST API at https://api.terminal.shop (dev
    sandbox at https://api.dev.terminal.shop) covering products, cart, orders,
    subscriptions, addresses, cards, profile, tokens, OAuth apps, an email
    signup, and an aggregate /view/init endpoint - 37 endpoints generated from
    an OpenAPI spec via Stainless, with official SDKs in Go, JavaScript/
    TypeScript, Python, Java, Kotlin, and Ruby plus a Terraform provider.
    Authentication is a Bearer personal access token (trm_live_* / trm_test_*)
    or OAuth 2.0. No WebSocket (ws:// or wss://) or SSE streaming endpoint is
    documented. The famous `ssh terminal.shop` ordering experience is an SSH
    TUI client over the same REST API, not a separate documented protocol.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.terminal.shop
      documented: true
    - protocol: REST
      scheme: https
      baseURL: https://api.dev.terminal.shop
      documented: true
    - protocol: SSH
      scheme: ssh
      note: Interactive storefront TUI via `ssh terminal.shop`; client experience backed by the REST API, not a documented machine API surface.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Terminal's API reference or SDKs as of the review date.
  endpointsConfirmedRest:
