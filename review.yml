sources:
  - url: https://www.terminal.shop/api
    type: Documentation
    note: Public API docs; REST base URL https://api.terminal.shop, Bearer auth, no WebSocket mentioned.
  - url: https://github.com/terminaldotshop
    type: GitHub
    note: Official Stainless-generated SDKs (Go, JS, Python, Java, Kotlin, Ruby) and a Terraform provider.
  - url: https://github.com/terminaldotshop/terminal-sdk-go
    type: SDK
    note: api.md and .stats.yml confirm 37 endpoints across 11 resources from the OpenAPI spec; all HTTPS REST.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No streaming protocol surface exists. The API is request/response REST
    only, so no AsyncAPI document was authored. apis.yml documents the seven
    sub-API groupings over the REST surface.
