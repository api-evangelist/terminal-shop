description: >-
  FinOps view of Terminal spend. The Terminal Shop API itself is free - there
  are no API access, per-call, or token fees. Spend is entirely product
  spend: the price (in cents) of each coffee variant ordered, plus shipping,
  charged at order placement and per recurring subscription shipment. Payments
  settle through Stripe. A dev sandbox places test orders without real
  charges, so non-production usage is zero-cost.
notes: >-
  There are no metered API charges to optimize; cost management is about
  coffee order volume, variant selection, and shipping. Per-variant prices and
  shipping amounts come live from the API (ProductVariant.price and
  order.amount.shipping, both in cents). Verify current prices against the
  live catalog.
sources:
