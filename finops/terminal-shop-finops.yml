meters:
- name: api_access
  description: Terminal Shop API access - free; no charge per request or per token.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - token
- name: product_amount
  description: Coffee product cost per ordered variant, in US cents.
  unit: cents
  aggregation: sum
  dimensions:
  - account
  - order
  - productVariant
- name: shipping_amount
  description: Shipping charged per order, in US cents.
  unit: cents
  aggregation: sum
  dimensions:
  - account
  - order
- name: subscription_amount
  description: Recurring coffee subscription cost per shipment, in US cents.
  unit: cents
  aggregation: sum
  dimensions:
  - account
  - subscription
  - productVariant
principles:
- name: Visibility
  description: Pull orders via GET /order and subscriptions via GET /subscription; sum amount fields (in cents) per account.
- name: Allocation
  description: Tag orders and subscriptions to teams or cost centers; the API key/account scopes spend.
- name: Optimization
  description: Use the dev sandbox for all testing to avoid real charges; consolidate shipments and choose subscription schedules that fit consumption.
- name: Accountability
  description: Review coffee order and subscription spend per account against budget; API access carries no fee to monitor.
maintainers:
