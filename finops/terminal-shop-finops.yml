  pricingCategory: Usage-Based
  billingFrequency: Per Order
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
  - Adjustment
focusColumns:
  ServiceName: Terminal Shop
  ServiceCategory: E-Commerce and Retail
